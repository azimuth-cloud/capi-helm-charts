{{- if and .Values.cni.enabled (eq .Values.cni.type "calico") }}
{{- $clusterName := include "cluster-addons.clusterName" . }}
# These resources are consumed by Sveltos ClusterProfiles on the management cluster,
# which select clusters labelled with addons.stackhpc.com/cni=calico
---
# Default values for the tigera-operator chart
# This is a Sveltos template, instantiated using the CAPI Cluster object
apiVersion: v1
kind: Secret
type: addons.projectsveltos.io/cluster-profile
metadata:
  name: {{ $clusterName }}-cni-calico-config
  labels:
    {{- include "cluster-addons.componentLabels" (list . "cni-calico") | nindent 4 }}
  annotations:
    projectsveltos.io/template: "ok"
stringData:
  values.yaml: |
    installation:
      nodeMetricsPort: 9091
      typhaMetricsPort: 9093
      calicoNetwork:
        bgp: Disabled
        nodeAddressAutodetectionV4:
          kubernetes: NodeInternalIP
        ipPools:
    {{ "{{-" }} range .Cluster.spec.clusterNetwork.pods.cidrBlocks {{ "}}" }}
          - blockSize: 26
            cidr: {{ "{{" }} . {{ "}}" }}
            disableBGPExport: false
            encapsulation: VXLAN
            natOutgoing: Enabled
            nodeSelector: all()
    {{ "{{-" }} end {{ "}}" }}
---
# User-supplied values for the tigera-operator chart, applied after the defaults
apiVersion: v1
kind: Secret
type: addons.projectsveltos.io/cluster-profile
metadata:
  name: {{ $clusterName }}-cni-calico-overrides
  labels:
    {{- include "cluster-addons.componentLabels" (list . "cni-calico") | nindent 4 }}
stringData:
  values.yaml: |
    {{- toYaml .Values.cni.calico.release.values | nindent 4 }}
{{- if .Values.cni.calico.globalNetworkPolicy }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $clusterName }}-cni-calico-global-network-policies
  labels:
    {{- include "cluster-addons.componentLabels" (list . "cni-calico-globalnetpolicy") | nindent 4 }}
data:
  policies.yaml: |
    ---
    apiVersion: projectcalico.org/v3
    kind: GlobalNetworkPolicy
    metadata:
      name: default.{{ include "cluster-addons.componentName" (list . "deny-egress") }}
    spec:
      order: {{ .Values.cni.calico.globalNetworkPolicy.denyPriority }}
      namespaceSelector: {{ .Values.cni.calico.globalNetworkPolicy.denyNamespaceSelector }}
      types:
        - Egress
      egress:
        - action: Deny
          ipVersion: 4
          destination:
            nets:
            {{- range .Values.cni.calico.globalNetworkPolicy.denyEgressCidrs }}
              - {{ . }}
            {{ end }}
        - action: Deny
          ipVersion: 6
          destination:
            nets:
            {{- range .Values.cni.calico.globalNetworkPolicy.denyv6EgressCidrs }}
              - {{ . }}
            {{ end }}
    ---
    apiVersion: projectcalico.org/v3
    kind: GlobalNetworkPolicy
    metadata:
      name: default.{{ include "cluster-addons.componentName" (list . "allow-global-egress") }}
    spec:
      order: {{ .Values.cni.calico.globalNetworkPolicy.allowPriority }}
      types:
        - Egress
      egress:
        - action: Allow
          ipVersion: 4
          destination:
            nets:
            {{- range .Values.cni.calico.globalNetworkPolicy.allowEgressCidrs }}
              - {{ . }}
            {{ end }}
        - action: Allow
          ipVersion: 6
          destination:
            nets:
            {{- range .Values.cni.calico.globalNetworkPolicy.allowv6EgressCidrs }}
              - {{ . }}
            {{ end }}
{{- end }}
{{- if .Values.monitoring.enabled }}
---
# As of 3.28.1, the Tigera operator now creates a calico-typha-metrics service itself,
# but uses a different port name
# On upgraded deployments, the Tigera operator happily adopts the existing service but breaks
# the metrics collection when the port is renamed
# On new deployments, this release fails because the service exists but is not owned by
# the Helm release
#
# In order to avoid this happening again, this release no longer relies on any services
# created by the operator for metrics collection, instead managing our own services with
# a naming convention that is unlikely to conflict with Calico resources
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $clusterName }}-cni-calico-monitoring
  labels:
    {{- include "cluster-addons.componentLabels" (list . "cni-calico-monitoring") | nindent 4 }}
data:
  kube-controllers.yaml: |
    apiVersion: v1
    kind: Service
    metadata:
      name: cni-calico-monitoring-kube-controllers
      namespace: calico-system
      labels:
        app.kubernetes.io/name: cni-calico-monitoring
        app.kubernetes.io/component: kube-controllers
    spec:
      clusterIP: None
      ports:
        - name: metrics-port
          port: 9094
      selector:
        k8s-app: calico-kube-controllers
    ---
    apiVersion: monitoring.coreos.com/v1
    kind: ServiceMonitor
    metadata:
      name: cni-calico-monitoring-kube-controllers
      namespace: calico-system
    spec:
      endpoints:
        - port: metrics-port
      namespaceSelector:
        matchNames:
          - calico-system
      selector:
        matchLabels:
          app.kubernetes.io/name: cni-calico-monitoring
          app.kubernetes.io/component: kube-controllers
  node.yaml: |
    apiVersion: v1
    kind: Service
    metadata:
      name: cni-calico-monitoring-node
      namespace: calico-system
      labels:
        app.kubernetes.io/name: cni-calico-monitoring
        app.kubernetes.io/component: node
    spec:
      clusterIP: None
      ports:
        - name: metrics-port
          port: 9091
      selector:
        k8s-app: calico-node
    ---
    apiVersion: monitoring.coreos.com/v1
    kind: ServiceMonitor
    metadata:
      name: cni-calico-monitoring-node
      namespace: calico-system
    spec:
      endpoints:
        - port: metrics-port
      namespaceSelector:
        matchNames:
          - calico-system
      selector:
        matchLabels:
          app.kubernetes.io/name: cni-calico-monitoring
          app.kubernetes.io/component: node
  typha.yaml: |
    apiVersion: v1
    kind: Service
    metadata:
      name: cni-calico-monitoring-typha
      namespace: calico-system
      labels:
        app.kubernetes.io/name: cni-calico-monitoring
        app.kubernetes.io/component: typha
    spec:
      clusterIP: None
      ports:
        - name: metrics-port
          port: 9093
      selector:
        k8s-app: calico-typha
    ---
    apiVersion: monitoring.coreos.com/v1
    kind: ServiceMonitor
    metadata:
      name: cni-calico-monitoring-typha
      namespace: calico-system
    spec:
      endpoints:
        - port: metrics-port
      namespaceSelector:
        matchNames:
          - calico-system
      selector:
        matchLabels:
          app.kubernetes.io/name: cni-calico-monitoring
          app.kubernetes.io/component: typha
  dashboards.yaml: |
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: cni-calico-dashboards
      namespace: {{ .Values.cni.calico.release.namespace }}
      labels:
        grafana_dashboard: "1"
    data:
      cni-calico-felix-dashboard.json: |
        {{- .Files.Get "grafana-dashboards/cni-calico-felix-dashboard.json" | nindent 8 }}
      cni-calico-typha-dashboard.json: |
        {{- .Files.Get "grafana-dashboards/cni-calico-typha-dashboard.json" | nindent 8 }}
{{- end }}
{{- end }}
