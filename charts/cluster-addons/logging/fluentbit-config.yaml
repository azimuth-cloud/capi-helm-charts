apiVersion: logging.banzaicloud.io/v1beta1
kind: FluentdConfig
metadata:
  name: logging-configuration
  namespace: monitoring-system
spec:
  logLevel: warn
  metrics:
    enabled: true
    serviceMonitor: true
  image:
    pullPolicy: IfNotPresent
  scaling:
    replicas: 2
  livenessDefaultCheck: true
  disablePvc: true
  bufferStorageVolume:
    emptyDir: {}
  resources:
    limits:
      cpu: 1000m
      memory: 2Gi
    requests:
      cpu: 500m
      memory: 2Gi