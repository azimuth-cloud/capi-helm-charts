apiVersion: logging.banzaicloud.io/v1beta1
kind: FluentbitAgent
metadata:
  name: logging-configuration
  namespace: {{ .Values.monitoring.loggingOperator.release.namespace }}
spec:
  metrics:
    serviceMonitor: true
  resources:
{{ toYaml .Values.monitoring.loggingOperator.fluentbit.resources | indent 4 }}
  tolerations:
{{ toYaml .Values.monitoring.loggingOperator.fluentbit.tolerations | indent 4 }}
