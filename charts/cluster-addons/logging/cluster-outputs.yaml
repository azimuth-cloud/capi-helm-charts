apiVersion: logging.banzaicloud.io/v1beta1
kind: ClusterOutput
metadata:
  name: cluster-logging
  namespace: {{ .Values.monitoring.loggingOperator.release.namespace }}
spec:
  loki:
    url: http://{{ .Values.monitoring.loki_v3.chart.name }}.{{ .Values.monitoring.loki_v3.release.namespace }}.svc.cluster.local:3100
    extract_kubernetes_labels: false
    labels:
      namespace: "$.kubernetes.namespace_name"
      pod: "$.kubernetes.pod_name"
      container: "$.kubernetes.container_name"
      app: "$.kubernetes.labels.app"
    buffer:
      timekey: 30s
      timekey_wait: 1s
      timekey_use_utc: true
      chunk_limit_size: 16M
      queued_chunks_limit_size: 16
      overflow_action: drop_oldest_chunk
---
apiVersion: logging.banzaicloud.io/v1beta1
kind: ClusterOutput
metadata:
  name: cluster-logging-systemd
  namespace: {{ .Values.monitoring.loggingOperator.release.namespace }}
spec:
  loki:
    url: http://{{ .Values.monitoring.loki_v3.chart.name }}.{{ .Values.monitoring.loki_v3.release.namespace }}.svc.cluster.local:3100
    labels:
      unit: "$._SYSTEMD_UNIT"
      hostname: "$._HOSTNAME"
    remove_keys:
      - _SYSTEMD_UNIT
      - _HOSTNAME
    drop_single_key: true
    buffer:
      timekey: 30s
      timekey_wait: 1s
      timekey_use_utc: true
      chunk_limit_size: 16M
      queued_chunks_limit_size: 16
      overflow_action: drop_oldest_chunk
