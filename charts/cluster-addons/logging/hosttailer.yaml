apiVersion: logging-extensions.banzaicloud.io/v1alpha1
kind: HostTailer
metadata:
  name: systemd-journal
  namespace: monitoring-system
spec:
  workloadOverrides:
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule

  systemdTailers:
    - name: journal
      maxEntries: 1000