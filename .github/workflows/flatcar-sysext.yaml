---
name: test flatcar sysext
on:
  workflow_call:
    inputs:
      ref:
        type: string
        description: The Git ref under test.
        required: true
      base-ref:
        type: string
        description: The Git ref to compare against when deciding whether to run the tests.
        required: true
      chart-version:
        type: string
        description: The version of the charts to test
        required: true
      tests-full:
        type: boolean
        description: Run Sonobuoy in full mode for the latest tests, rather than quick mode
        required: true

jobs:
  # Only run when the flatcar sysext manifest (via the azimuth-images version) or flatcar specific code has changed
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      run: ${{ steps.changes.outputs.run }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Check for flatcar sysext changes
        id: changes
        run: |
          FLATCAR_PATHS=(
            dependencies.json
            charts/openstack-cluster/templates/_helpers.flatcar-sysext.tpl
            scripts/ensure-flatcar-sysext-images.py
            .github/workflows/flatcar-sysext.yaml
          )
          CHANGED="$(git diff --name-only "$BASE_REF" HEAD -- "${FLATCAR_PATHS[@]}")"
          if [ -n "$CHANGED" ]; then
            echo "Flatcar sysext files changed, running tests"
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No flatcar sysext changes, skipping tests"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          BASE_REF: ${{ inputs.base-ref }}

  ensure_images:
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ needs.changes.outputs.run == 'true' }}
    permissions:
      contents: read
    outputs:
      latest: ${{ steps.ensure-images.outputs.latest }}
      upgrade: ${{ steps.ensure-images.outputs.upgrade }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@eb1897b8dc4b5d5bfe39a428a8f2304605e0983c # v7.0.0

      - name: Write cloud credential
        run: echo "$OS_CLOUDS" > ./clouds.yaml
        env:
          OS_CLOUDS: ${{ secrets.OS_CLOUDS }}

      - name: Fetch Flatcar sysext manifest
        run: |
          VN="$(jq -r '.["azimuth-images"]' ./dependencies.json)"
          gh release download "$VN" -R azimuth-cloud/azimuth-images -p flatcar-sysext-manifest.json
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Ensure Flatcar sysext images
        id: ensure-images
        run: ./scripts/ensure-flatcar-sysext-images.py flatcar-sysext-manifest.json --arches x86_64 --output "$GITHUB_OUTPUT"
        env:
          OS_CLOUD: ${{ vars.TARGET_CLOUD }}

  # This job tests a clean deployment of the latest version
  latest:
    runs-on: ubuntu-latest
    needs: [ensure_images]
    permissions:
      contents: read
    name: latest (${{ matrix.arch }}, ${{ matrix.kubernetes_version }})
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.ensure_images.outputs.latest) }}
    env:
      # Flatcar sysext requires the Ignition bootstrap format, enabled when clusterctl installs CAPI
      EXP_KUBEADM_BOOTSTRAP_FORMAT_IGNITION: "true"
      CLUSTER_NAME: ci-${{ github.run_id }}-flatcar-${{ matrix.label }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref }}

      - name: Create kind cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0

      - name: Set up test environment
        uses: ./.github/actions/setup

      - name: Write cloud credential
        run: echo "$OS_CLOUDS" > ./clouds.yaml
        env:
          OS_CLOUDS: ${{ secrets.OS_CLOUDS }}

      # JSON is valid YAML, so the values from the matrix can be used as-is
      - name: Write Flatcar sysext values
        run: echo "$VALUES" > ./flatcar-sysext-values.yaml
        env:
          VALUES: ${{ toJSON(matrix.values) }}

      - name: Test clean Kubernetes ${{ matrix.kubernetes_version }} deployment
        uses: ./.github/actions/upgrade-and-test
        with:
          name: ${{ env.CLUSTER_NAME }}
          os-cloud: ${{ vars.TARGET_CLOUD }}
          chart-version: ${{ inputs.chart-version }}
          kubernetes-version: ${{ matrix.kubernetes_version }}
          image-id: ${{ matrix.image_id }}
          defaults-path: ./.github/values/${{ vars.TARGET_CLOUD }}/base.yaml
          overrides-path: ./flatcar-sysext-values.yaml
          sonobuoy-mode: ${{ inputs.tests-full && 'certified-conformance' || 'quick' }}
          sonobuoy-upload: ${{ inputs.tests-full && 'yes' || 'no' }}

      - name: Collect workload cluster diagnostics
        uses: ./.github/actions/collect-diagnostics
        with:
          name: ${{ env.CLUSTER_NAME }}
          name-suffix: flatcar-${{ matrix.label }}
          os-cloud: ${{ vars.TARGET_CLOUD }}
        if: ${{ always() }}

      - name: Delete Flatcar sysext deployment
        run: helm delete "$CLUSTER_NAME" --wait
        if: ${{ always() }}

      - name: Upload logs
        uses: ./.github/actions/upload-logs
        with:
          name-suffix: flatcar-${{ matrix.label }}
        if: ${{ always() }}

  # This job tests upgrading between each pair of consecutive versions
  upgrade:
    runs-on: ubuntu-latest
    needs: [ensure_images]
    permissions:
      contents: read
    name: upgrade (${{ matrix.arch }}, ${{ matrix.from.kubernetes_version }} -> ${{ matrix.to.kubernetes_version }})
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.ensure_images.outputs.upgrade) }}
    env:
      # Flatcar sysext requires the Ignition bootstrap format, enabled when clusterctl installs CAPI
      EXP_KUBEADM_BOOTSTRAP_FORMAT_IGNITION: "true"
      CLUSTER_NAME: ci-${{ github.run_id }}-flatcar-${{ matrix.label }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref }}

      - name: Create kind cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0

      - name: Set up test environment
        uses: ./.github/actions/setup

      - name: Write cloud credential
        run: echo "$OS_CLOUDS" > ./clouds.yaml
        env:
          OS_CLOUDS: ${{ secrets.OS_CLOUDS }}

      - name: Write Flatcar sysext values
        run: |
          echo "$FROM_VALUES" > ./flatcar-sysext-values-from.yaml
          echo "$TO_VALUES" > ./flatcar-sysext-values-to.yaml
        env:
          FROM_VALUES: ${{ toJSON(matrix.from.values) }}
          TO_VALUES: ${{ toJSON(matrix.to.values) }}

      - name: Deploy Kubernetes ${{ matrix.from.kubernetes_version }}
        uses: ./.github/actions/upgrade-and-test
        with:
          name: ${{ env.CLUSTER_NAME }}
          os-cloud: ${{ vars.TARGET_CLOUD }}
          chart-version: ${{ inputs.chart-version }}
          kubernetes-version: ${{ matrix.from.kubernetes_version }}
          image-id: ${{ matrix.from.image_id }}
          defaults-path: ./.github/values/${{ vars.TARGET_CLOUD }}/base.yaml
          overrides-path: ./flatcar-sysext-values-from.yaml

      - name: Upgrade to Kubernetes ${{ matrix.to.kubernetes_version }}
        uses: ./.github/actions/upgrade-and-test
        with:
          name: ${{ env.CLUSTER_NAME }}
          os-cloud: ${{ vars.TARGET_CLOUD }}
          chart-version: ${{ inputs.chart-version }}
          kubernetes-version: ${{ matrix.to.kubernetes_version }}
          image-id: ${{ matrix.to.image_id }}
          defaults-path: ./.github/values/${{ vars.TARGET_CLOUD }}/base.yaml
          overrides-path: ./flatcar-sysext-values-to.yaml

      - name: Collect workload cluster diagnostics
        uses: ./.github/actions/collect-diagnostics
        with:
          name: ${{ env.CLUSTER_NAME }}
          name-suffix: flatcar-${{ matrix.label }}
          os-cloud: ${{ vars.TARGET_CLOUD }}
        if: ${{ always() }}

      - name: Delete Flatcar sysext deployment
        run: helm delete "$CLUSTER_NAME" --wait
        if: ${{ always() }}

      - name: Upload logs
        uses: ./.github/actions/upload-logs
        with:
          name-suffix: flatcar-${{ matrix.label }}
        if: ${{ always() }}
