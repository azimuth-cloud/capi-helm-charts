name: Helm Lint
on:
  push:
  workflow_call:
    inputs:
      ref:
        type: string
        description: The Git ref under test.
        required: true

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      # CAPO v0.15.0 schemas from datreeio/CRDs-catalog#984.
      CRDS_CATALOG_REPOSITORY: datreeio/CRDs-catalog
      CRDS_CATALOG_REF: b816c3f39cbda8e23a398bb2ddf19b48e3aeb7bf
      KUBECONFORM_IMAGE: ghcr.io/yannh/kubeconform:v0.8.0@sha256:faffaf43f95aa6425306e1ab8d6fcad72acb9049158f38e574c085ea1ec0f64e
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0
        with:
          version: v3.15.3

      - name: Set up chart-testing
        uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f # v2.8.0

      - name: Run chart-testing (lint)
        run: |-
          ct lint \
            --target-branch ${{ github.event.repository.default_branch }} \
            --all \
            --validate-maintainers=false

      - name: Run template validation (current values)
        run: |
          set -eo pipefail
          helm template foo charts/openstack-cluster \
            -f charts/openstack-cluster/tests/values_base.yaml \
            -f charts/openstack-cluster/tests/values_full.yaml \
            | docker run -i --rm "$KUBECONFORM_IMAGE" \
            --strict --summary --verbose \
            --schema-location default \
            --schema-location "https://raw.githubusercontent.com/$CRDS_CATALOG_REPOSITORY/$CRDS_CATALOG_REF/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json" \
            --skip HelmRelease,Manifests

      - name: Run template validation (Flatcar values)
        run: |-
          set -eo pipefail
          helm template foo charts/openstack-cluster \
            -f charts/openstack-cluster/tests/values_base.yaml \
            -f charts/openstack-cluster/tests/values_flatcar.yaml \
            | docker run -i --rm "$KUBECONFORM_IMAGE" \
            --strict --summary \
            --schema-location default \
            --schema-location "https://raw.githubusercontent.com/$CRDS_CATALOG_REPOSITORY/$CRDS_CATALOG_REF/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json" \
            --skip HelmRelease,Manifests

      - name: Run template validation (Flatcar sysext values)
        run: |-
          set -eo pipefail
          helm template foo charts/openstack-cluster \
            -f charts/openstack-cluster/tests/values_base.yaml \
            -f charts/openstack-cluster/tests/values_flatcar_sysext.yaml \
            | docker run -i --rm "$KUBECONFORM_IMAGE" \
            --strict --summary \
            --schema-location default \
            --schema-location "https://raw.githubusercontent.com/$CRDS_CATALOG_REPOSITORY/$CRDS_CATALOG_REF/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json" \
            --skip HelmRelease,Manifests

      # NOTE: Run the following command locally to generate updated snapshots:
      # docker run -i --rm -v $(pwd):/apps helmunittest/helm-unittest charts/openstack-cluster -u
      - name: Run manifest snapshot test (current values)
        run: docker run -i --rm -v $(pwd):/apps helmunittest/helm-unittest charts/openstack-cluster

      - name: Get latest tag
        id: latest-tag
        run: |
          set -eo pipefail
          TAG_NAME="$(curl -fsSL "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/latest" | jq -r '.tag_name')"
          echo "tag-name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
      - name: Checkout default values from latest tag
        run: |
          git checkout $LATEST_TAG -- charts/openstack-cluster/values.yaml
        env:
          LATEST_TAG: ${{ steps.latest-tag.outputs.tag-name }}

      - name: Run template validation (values from latest tag)
        run: |
          set -eo pipefail
          helm template foo charts/openstack-cluster \
            -f charts/openstack-cluster/tests/values_base.yaml \
            -f charts/openstack-cluster/tests/values_full.yaml \
            | docker run -i --rm "$KUBECONFORM_IMAGE" \
            --strict --summary --verbose \
            --schema-location default \
            --schema-location "https://raw.githubusercontent.com/$CRDS_CATALOG_REPOSITORY/$CRDS_CATALOG_REF/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json" \
            --skip HelmRelease,Manifests

      # NOTE: Run the following command locally to generate updated snapshots:
      # docker run -i --rm -v $(pwd):/apps helmunittest/helm-unittest charts/openstack-cluster -u
      - name: Run manifest snapshot test (values from latest tag)
        run: docker run -i --rm -v $(pwd):/apps helmunittest/helm-unittest charts/openstack-cluster
