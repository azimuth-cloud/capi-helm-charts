---
name: Collect workload cluster diagnostics

description: >-
  Capture diagnostics for a workload cluster as a workflow artifact.

inputs:
  name:
    description: The name of the cluster
    required: true
  name-suffix:
    description: The suffix for diagnostics artifact
    required: true
  os-client-config-file:
    description: The path of the OpenStack clouds file
    required: true
    default: ./clouds.yaml
  os-cloud:
    description: The name of the cloud within the OpenStack clouds file
    required: true
    default: openstack

runs:
  using: "composite"
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@eb1897b8dc4b5d5bfe39a428a8f2304605e0983c # v7.0.0

    - name: Install openstack CLI
      shell: bash
      run: |-
        uv tool install --quiet python-openstackclient
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    - name: Dump Cluster API resource status and events
      shell: bash
      continue-on-error: true
      run: |-
        mkdir -p diagnostics
        kubectl get clusters,openstackclusters,machines,openstackmachines,openstackservers,kubeadmcontrolplanes,machinedeployments,machinesets \
          -A -o yaml > diagnostics/capi-resources.yaml
        kubectl get events -A --sort-by=.lastTimestamp > diagnostics/capi-events.txt

    - name: Dump workload cluster node and pod status (best-effort)
      shell: bash
      continue-on-error: true
      run: |-
        mkdir -p diagnostics
        # Get the kubeconfig secret for the workload cluser.
        # NB this secret should not be included in the output.
        (umask 077; kubectl get secret ${{ inputs.name }}-kubeconfig \
          -o go-template='{{ .data.value | base64decode }}' \
          > workload-kubeconfig) \
          || echo "no ${{ inputs.name }}-kubeconfig secret found" > diagnostics/workload-cluster-MISSING.txt
        # Get diagnostics from the workload cluster.
        if [ -s workload-kubeconfig ]; then
          kubectl --kubeconfig=workload-kubeconfig --request-timeout=15s \
            get nodes -o yaml > diagnostics/workload-nodes.yaml \
            || echo "could not list workload nodes" > diagnostics/workload-nodes.yaml
          kubectl --kubeconfig=workload-kubeconfig --request-timeout=15s \
            get pods -A -o wide > diagnostics/workload-pods.txt \
            || echo "could not list workload pods" > diagnostics/workload-pods.txt
          kubectl --kubeconfig=workload-kubeconfig --request-timeout=15s \
            get events -A --sort-by=.lastTimestamp > diagnostics/workload-events.txt \
            || echo "could not list workload events" > diagnostics/workload-events.txt
        fi
        # scrap the secret so it can't be leaked by mistake.
        rm -f workload-kubeconfig

    - name: Dump OpenStack server and quota state
      shell: bash
      continue-on-error: true
      run: |-
        mkdir -p diagnostics
        openstack server list --long -f yaml > diagnostics/openstack-servers.yaml
        openstack floating ip list -f yaml > diagnostics/openstack-floating-ips.yaml
        openstack quota show -f yaml > diagnostics/openstack-quota.yaml
      env:
        OS_CLIENT_CONFIG_FILE: ${{ inputs.os-client-config-file }}
        OS_CLOUD: ${{ inputs.os-cloud }}

    - name: Capture console logs for this cluster's servers
      shell: bash
      continue-on-error: true
      run: |-
        mkdir -p diagnostics
        server_ids=$(openstack server list \
          --name "^${CLUSTER_NAME}-" \
          -f value -c ID)
        if [ -z "$server_ids" ]; then
          echo "No matching OpenStack servers found for cluster ${CLUSTER_NAME} (already deleted?)" \
            > diagnostics/console-logs-MISSING.txt
        fi
        for id in $server_ids; do
          name=$(openstack server show "$id" -f value -c name)
          echo "Capturing console log for server $name ($id)"
          openstack console log show "$id" > "diagnostics/console-${name}.txt" \
            || echo "console log unavailable for $name ($id)" > "diagnostics/console-${name}.txt"
        done
      env:
        OS_CLIENT_CONFIG_FILE: ${{ inputs.os-client-config-file }}
        OS_CLOUD: ${{ inputs.os-cloud }}
        CLUSTER_NAME: ${{ inputs.name }}

    - name: Upload diagnostics artifact
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
      with:
        name: workload-node-diagnostics-${{ inputs.name-suffix }}
        path: ./diagnostics/*
        if-no-files-found: warn
